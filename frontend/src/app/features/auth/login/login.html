<div class="login-page">

  <div class="background background-left"></div>
  <div class="background background-right"></div>

  <main class="login-card">

    <div class="brand">

      <div class="brand-icon">
        <span class="column-icon">🏛</span>
      </div>

      <h1>
        Arkeoloji Buluntu Sistemi
      </h1>

      <p>
        Philadelphia Kazısı
      </p>

    </div>


    <form
      class="login-form"
      (ngSubmit)="login()"
    >

      <!-- =========================
           E-POSTA
      ========================== -->

      <div class="form-group">

        <label for="email">
          Kullanıcı Adı
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          [disabled]="loading()"
          placeholder="E-posta adresinizi giriniz..."
          autocomplete="username"
        />

      </div>


      <!-- =========================
           ŞİFRE
      ========================== -->

      <div class="form-group">

        <label for="password">
          Şifre
        </label>

        <div class="password-field">

          <input
            id="password"
            name="password"
            [type]="
              showPassword
                ? 'text'
                : 'password'
            "
            [(ngModel)]="password"
            [disabled]="loading()"
            placeholder="Şifrenizi giriniz..."
            autocomplete="current-password"
          />


          <button
            type="button"
            class="password-toggle"
            [disabled]="loading()"
            (click)="togglePassword()"
            aria-label="Şifreyi göster veya gizle"
          >
            {{
              showPassword
                ? '◉'
                : '○'
            }}
          </button>

        </div>

      </div>


      <!-- =========================
           OPTIONS
      ========================== -->

      <div class="form-options">

        <label class="remember">

          <input
            type="checkbox"
            name="rememberMe"
            [(ngModel)]="rememberMe"
            [disabled]="loading()"
          />

          <span>
            Beni hatırla
          </span>

        </label>


<a
  class="forgot-password"
  routerLink="/forgot-password"
>
  Şifremi unuttum
</a>

      </div>


      <!-- =========================
           ERROR
      ========================== -->

      @if (errorMessage()) {

        <div class="error-message">
          {{ errorMessage() }}
        </div>

      }


      <!-- =========================
           LOGIN
      ========================== -->

      <button
        class="login-button"
        type="submit"
        [disabled]="loading()"
      >
        {{
          loading()
            ? 'Giriş yapılıyor...'
            : 'GİRİŞ YAP'
        }}
      </button>

    </form>


    <footer>
      © 2026 Philadelphia Buluntu Sistemi
    </footer>

  </main>

</div>
