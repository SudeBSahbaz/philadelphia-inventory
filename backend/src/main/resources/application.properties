spring.application.name=inventory

# ==============================
# DATABASE
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:5432/philadelphia_inventory
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ==============================
# FLYWAY
# ==============================

spring.flyway.enabled=true

# ==============================
# ERROR RESPONSES
# ==============================

server.error.include-message=always

# ==============================
# FILE STORAGE
# ==============================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==============================
# CORS
# ==============================

app.cors.allowed-origin=http://localhost:4200

# ==============================
# EMAIL
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# PASSWORD RESET
# ==============================

app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.password-reset.expiration-minutes=30

# CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}